name: Deploy to GitHub Pages

# Publishes the built app to the `gh-pages` branch, which your repo's
# GitHub Pages settings already serve. Pushes to main deploy automatically;
# you can also run this workflow manually (Actions tab -> Deploy -> Run workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to push the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --watch=false

      - name: Build (with project-page base href)
        run: npx ng build --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Add 404.html for SPA deep links on Pages
        run: cp dist/marginalia-fighters/browser/index.html dist/marginalia-fighters/browser/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/marginalia-fighters/browser
          publish_branch: gh-pages
